defaultNamespace: cattle-neuvector-system

helm:
  releaseName: neuvector
  takeOwnership: true
  repo: https://charts.rancher.io
  chart: neuvector
  version: 110.0.2+up2.11.2
  valuesFiles:
    - neuvector-values-carbide.yaml

diff:
  comparePatches:
    - apiVersion: coordination.k8s.io/v1
      kind: Lease
      name: neuvector-controller
      jsonPointers:
        - /spec/leaseTransitions
    - apiVersion: coordination.k8s.io/v1
      kind: Lease
      name: neuvector-cert-upgrader
      jsonPointers:
        - /spec/leaseTransitions
    - apiVersion: batch/v1
      kind: CronJob
      name: neuvector-cert-upgrader-pod
      jsonPointers:
        - /metadata/annotations
    - apiVersion: v1
      kind: Secret
      namespace: cattle-neuvector-system
      name: neuvector-internal-certs
      operations:
        - op: ignore

dependsOn:
  - name: neuvector-crd-fleet-neuvector-crd
