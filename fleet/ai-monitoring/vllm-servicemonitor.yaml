apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
spec:
  namespaceSelector:
    matchNames:
      - vllm
  selector:
    matchLabels:
      app.kubernetes.io/part-of: vllm
      app.kubernetes.io/component: serving-engine
  endpoints:
    - port: service-port
      path: /metrics
