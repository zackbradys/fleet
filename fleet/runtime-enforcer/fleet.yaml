defaultNamespace: cattle-runtime-enforcer-system

namespaceLabels:
  pod-security.kubernetes.io/audit: privileged
  pod-security.kubernetes.io/audit-version: latest
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/enforce-version: latest
  pod-security.kubernetes.io/warn: privileged
  pod-security.kubernetes.io/warn-version: latest

helm:
  releaseName: ssre
  repo: oci://registry.ranchercarbide.dev/charts/suse-security-runtime-enforcer
  version: 0.2.1
  valuesFiles:
    - runtime-enforcer-values-carbide.yaml

dependsOn:
  - name: cert-manager-csi-driver-fleet-cert-manager-csi-driver
