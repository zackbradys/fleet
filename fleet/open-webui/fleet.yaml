defaultNamespace: open-webui

namespaceLabels:
  pod-security.kubernetes.io/enforce: baseline

helm:
  releaseName: open-webui
  repo: oci://registry.ranchercarbide.dev/charts/open-webui
  version: 8.19.1
  valuesFiles:
    - open-webui-values-carbide.yaml
  valuesFrom:
    - secretKeyRef:
        name: open-webui-values
        key: values.yaml

dependsOn:
  - name: cert-manager-fleet-cert-manager
  - name: milvus-fleet-milvus
  - name: litellm-fleet-litellm
