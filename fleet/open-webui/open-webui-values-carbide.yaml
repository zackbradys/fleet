global:
  imageRegistry: registry.ranchercarbide.dev
  tls:
    source: secret

ollama:
  enabled: false
pipelines:
  enabled: false
tika:
  enabled: true

# no model backend until the site values set one, since a blank url means api.openai.com
enableOpenaiApi: false
openaiApiKey: ""

ingress:
  enabled: true
  class: traefik
  host: '${ if hasKey .ClusterLabels "ai-webui-host" }${ get .ClusterLabels "ai-webui-host" }${ end }'
  tls: true
  existingSecret: open-webui-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: null
    traefik.ingress.kubernetes.io/router.middlewares: open-webui-https-redirect@kubernetescrd
service:
  type: ClusterIP

persistence:
  enabled: true
  size: 10Gi

extraEnvVars:
  - name: WEBUI_URL
    value: '${ if hasKey .ClusterLabels "ai-webui-host" }https://${ get .ClusterLabels "ai-webui-host" }${ end }'
  - name: ENABLE_SIGNUP
    value: "False"
  - name: ENABLE_INITIAL_ADMIN_SIGNUP
    value: "True"

extraResources:
  - apiVersion: ui.cattle.io/v1
    kind: NavLink
    metadata:
      name: open-webui
    spec:
      label: Open WebUI
      target: _blank
      description: Chat UI for the RGS AI Stack
      group: RGS AI Stack
      sideLabel: CHAT
      toURL: '${ if hasKey .ClusterLabels "ai-webui-host" }https://${ get .ClusterLabels "ai-webui-host" }${ end }'
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: https-redirect
    spec:
      redirectScheme:
        scheme: https
        permanent: true
