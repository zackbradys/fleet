global:
  imageRegistry: registry.ranchercarbide.dev

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# a home and caches in /tmp, which npx and uvx can write as the non root user
env:
  HOME: /tmp
  npm_config_cache: /tmp/.npm
  UV_CACHE_DIR: /tmp/.uv

# blank by default, each server here is served at http://open-webui-mcpo.open-webui-mcpo.svc:8000/<name>
config:
  mcpServers:
    # removes the chart's default server, which downloads from npm when the pod starts
    memory: null
