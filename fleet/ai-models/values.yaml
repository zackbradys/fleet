runtime:
  name: vllm
  image: registry.ranchercarbide.dev/containers/vllm-openai:0.32.0-nvidia
  shmSize: 20Gi
  env:
    - name: DO_NOT_TRACK
      value: "1"
    - name: HF_HUB_DISABLE_TELEMETRY
      value: "1"
    - name: HF_HUB_DISABLE_UPDATE_CHECK
      value: "1"
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: VLLM_NO_USAGE_STATS
      value: "1"

# scrapes the vllm metrics that the ai-monitoring dashboards read
monitoring:
  enabled: false

# the storage-config entries, each with type, bucket, and region, plus endpoint_url and keys outside aws
storage: {}

# service account with the storage initializer's model storage credentials
serviceAccountName: ""

# each model needs a name and storage or storageUri, see templates/inferenceservices.yaml for the rest
models: []
