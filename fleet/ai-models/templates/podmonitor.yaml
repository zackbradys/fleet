{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.runtime.name }}
spec:
  selector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  podMetricsEndpoints:
    - port: http1
      path: /metrics
{{- end }}
