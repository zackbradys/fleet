apiVersion: content.hauler.cattle.io/v1
kind: Charts
metadata:
  name: cloudnative-pg-charts
  annotations:
    hauler.dev/registry: registry.ranchercarbide.dev
spec:
  charts:
    - name: cloudnative-pg
      repoURL: oci://registry.ranchercarbide.dev/charts
      version: 0.29.1
      add-images: true
      valuesFiles:
        - cloudnative-pg-values-carbide.yaml
---
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: cloudnative-pg-images
spec:
  images:
    # set through the operator's env vars, so add-images doesn't find them
    - name: registry.ranchercarbide.dev/containers/postgresql:18.6-18.1
    - name: registry.ranchercarbide.dev/containers/pgbouncer:1.26.1-14.1
