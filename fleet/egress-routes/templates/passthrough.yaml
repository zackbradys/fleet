{{- range .Values.passthrough }}
{{- $name := printf "pass-%s" (.host | replace "." "-") | trunc 52 | trimSuffix "-" }}
{{- $port := .port | default 443 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ExternalName
  externalName: {{ .host }}
  ports:
    - name: https
      port: {{ $port }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ $name }}
  annotations:
    kubernetes.io/ingress.class: {{ $.Values.ingressClass }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ .host }}`)
      services:
        - name: {{ $name }}
          port: {{ $port }}
  tls:
    passthrough: true
{{- end }}
