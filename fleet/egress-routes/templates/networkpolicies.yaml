{{- if .Values.lockedNamespaces }}
# only the locked namespaces can reach the gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-gateway-clients
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml .Values.lockedNamespaces | nindent 18 }}
{{- range .Values.lockedNamespaces }}
---
# pods here reach only other pods, so every outside call has to go through the gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-through-gateway
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
{{- end }}
{{- end }}
