apiVersion: content.hauler.cattle.io/v1
kind: Charts
metadata:
  name: longhorn-charts
spec:
  charts:
    - name: longhorn
      repoURL: https://charts.rancher.io
      version: 110.1.0+up1.12.1
      add-images: true
      valuesFiles:
        - longhorn-values-carbide.yaml
---
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: longhorn-images
spec:
  images:
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-longhorn-engine:v1.12.1
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-longhorn-instance-manager:v1.12.1
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-backing-image-manager:v1.12.1
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-support-bundle-kit:v0.0.92
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-csi-attacher:v4.12.0
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-csi-node-driver-registrar:v2.17.0
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-csi-provisioner:v5.3.0
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-csi-resizer:v2.2.1
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-csi-snapshotter:v8.6.0
    - name: registry.ranchercarbide.dev/rancher/mirrored-longhornio-livenessprobe:v2.19.0
