defaultNamespace: longhorn-system

helm:
  releaseName: longhorn
  repo: https://charts.rancher.io
  chart: longhorn
  version: 110.1.0+up1.12.1
  valuesFiles:
    - longhorn-values-carbide.yaml

dependsOn:
  - name: longhorn-crd-fleet-longhorn-crd

targetCustomizations:
  - name: longhorn-v2
    clusterSelector:
      matchLabels:
        longhorn-v2: enabled
    helm:
      values:
        persistence:
          dataEngine: v2
        defaultSettings:
          v1DataEngine: false
          v2DataEngine: true
          createDefaultDiskLabeledNodes: true
