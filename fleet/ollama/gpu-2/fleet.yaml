defaultNamespace: ollama

namespaceLabels:
  pod-security.kubernetes.io/enforce: baseline

helm:
  releaseName: ollama-2
  repo: oci://registry.ranchercarbide.dev/charts/ollama
  version: 1.76.0
  valuesFiles:
    - ollama-values-carbide.yaml

dependsOn:
  - name: gpu-operator-fleet-gpu-operator

targetCustomizations:
  - name: not-enough-gpu-nodes
    clusterSelector:
      matchExpressions:
        - key: ai-gpu-nodes
          operator: NotIn
          values: ["3"]
    doNotDeploy: true
