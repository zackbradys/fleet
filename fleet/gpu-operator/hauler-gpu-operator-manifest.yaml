apiVersion: content.hauler.cattle.io/v1
kind: Charts
metadata:
  name: gpu-operator-charts
spec:
  charts:
    - name: gpu-operator
      repoURL: https://helm.ngc.nvidia.com/nvidia
      version: v26.7.2
---
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: gpu-operator-images
spec:
  images:
    # precompiled drivers, each tag matching a gpu node kernel from uname -r
    - name: registry.ranchercarbide.dev/third-party/nvidia/driver:595-6.12.0-160000.38-default-sles16.0
    - name: registry.ranchercarbide.dev/third-party/nvidia/driver:595-6.12.0-160000.40-default-sles16.0
    # compiled driver for gpu-driver=compiled, one per rhel 9 minor release the gpu nodes run
    - name: nvcr.io/nvidia/driver:595.112.07-rhel9.6
    - name: nvcr.io/nvidia/driver:595.112.07-rhel9.7
    - name: nvcr.io/nvidia/driver:595.112.07-rhel9.8
    - name: nvcr.io/nvidia/gpu-operator:v26.7.2
    - name: nvcr.io/nvidia/k8s/container-toolkit:v1.20.1
    - name: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
    - name: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4-distroless
    - name: nvcr.io/nvidia/cloud-native/k8s-driver-manager:v0.12.1
    - name: nvcr.io/nvidia/cloud-native/k8s-mig-manager:v0.15.1
    - name: nvcr.io/nvidia/cloud-native/k8s-cc-manager:v0.4.4
    - name: nvcr.io/nvidia/cloud-native/vgpu-device-manager:v0.5.1
    - name: nvcr.io/nvidia/cloud-native/nvidia-sandbox-device-plugin:v0.0.5
    - name: nvcr.io/nvidia/kubevirt-gpu-device-plugin:v1.6.0
    - name: nvcr.io/nvidia/dra-driver-nvidia-gpu:v0.5.1
    - name: registry.k8s.io/nfd/node-feature-discovery:v0.19.0
