defaultNamespace: gpu-operator

namespaceLabels:
  pod-security.kubernetes.io/audit: privileged
  pod-security.kubernetes.io/audit-version: latest
  pod-security.kubernetes.io/enforce: privileged
  pod-security.kubernetes.io/enforce-version: latest
  pod-security.kubernetes.io/warn: privileged
  pod-security.kubernetes.io/warn-version: latest

helm:
  releaseName: gpu-operator
  repo: https://helm.ngc.nvidia.com/nvidia
  chart: gpu-operator
  version: v26.7.2
  valuesFiles:
    - gpu-operator-values-carbide.yaml

# precompiled sles drivers from carbide by default, or another driver picked by the gpu-driver label
targetCustomizations:
  # rhel 9, precompiled by red hat, each tag matching a gpu node kernel from uname -r
  - name: driver-precompiled-rhel
    clusterSelector:
      matchLabels:
        gpu-driver: precompiled-rhel
    helm:
      values:
        driver:
          repository: registry.redhat.io/nvidia
          image: gpu-driver-rhel9
          version: "595"
  # rhel 9, built at boot from the node's kernel-devel, kernel-headers, kernel-core, and gcc
  - name: driver-compiled
    clusterSelector:
      matchLabels:
        gpu-driver: compiled
    helm:
      values:
        driver:
          repository: nvcr.io/nvidia
          version: "595.112.07"
          usePrecompiled: false
  - name: driver-preinstalled
    clusterSelector:
      matchLabels:
        gpu-driver: preinstalled
    helm:
      values:
        driver:
          enabled: false
