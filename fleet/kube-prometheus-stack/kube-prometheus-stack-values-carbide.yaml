global:
  imageRegistry: registry.ranchercarbide.dev

grafana:
  grafana.ini:
    security:
      allow_embedding: true
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: true
      org_role: Viewer
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/rancher-default-home.json
    users:
      auto_assign_org_role: Viewer
  image:
    repository: rancher/appco-grafana
    tag: 12.3.1-1.12
  sidecar:
    image:
      repository: rancher/appco-k8s-sidecar
      tag: 2.1.2-1.10
  initChownData:
    enabled: false
  testFramework:
    enabled: false

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    image:
      repository: rancher/prom-prometheus
      tag: v3.8.1

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  alertmanagerSpec:
    image:
      repository: rancher/appco-alertmanager
      tag: 0.30.0-12.16

prometheusOperator:
  image:
    repository: rancher/mirrored-prometheus-operator-prometheus-operator
    tag: v0.87.1
  prometheusConfigReloader:
    image:
      repository: rancher/mirrored-prometheus-operator-prometheus-config-reloader
      tag: v0.87.1
  thanosImage:
    repository: rancher/appco-thanos
    tag: 0.40.1-8.1
  admissionWebhooks:
    patch:
      image:
        repository: rancher/mirrored-jkroepke-kube-webhook-certgen
        tag: 1.7.4

kube-state-metrics:
  image:
    repository: rancher/appco-kube-state-metrics
    tag: 2.17.0-10.14

prometheus-node-exporter:
  image:
    repository: rancher/appco-node-exporter
    tag: 1.10.2-14.3
