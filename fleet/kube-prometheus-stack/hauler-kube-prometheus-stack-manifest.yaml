apiVersion: content.hauler.cattle.io/v1
kind: Charts
metadata:
  name: kube-prometheus-stack-charts
spec:
  charts:
    - name: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      version: 80.14.4
      add-images: true
      valuesFiles:
        - kube-prometheus-stack-values-carbide.yaml
---
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: kube-prometheus-stack-images
spec:
  images:
    - name: registry.ranchercarbide.dev/rancher/mirrored-prometheus-operator-prometheus-config-reloader:v0.87.1
    - name: registry.ranchercarbide.dev/rancher/appco-thanos:0.40.1-8.1
